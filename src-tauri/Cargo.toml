[package]
name = "pulse"
version = "0.1.0"
description = "Pulse — a fast, native API tester with deep network introspection"
authors = ["Pulse"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows quirk).
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }

# HTTP (low-level, so we can time every phase ourselves)
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"

# TLS (rustls with the `ring` provider — no cmake / C-heavy build needed).
# The one transitively-required crate the corporate proxy blocks (`untrusted`)
# is sourced from git instead — see [patch.crates-io] below.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
webpki-roots = "0.26"

# DNS (rich resolver detail: nameservers, records, TTL)
hickory-resolver = "0.24"

# Certificate parsing
x509-parser = "0.16"
sha2 = "0.10"

# Body decompression
flate2 = "1"
brotli = "7"
zstd = "0.13"

# Utilities
url = "2"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "2"

# The `untrusted` crate's published .crate download is blocked by the corporate
# proxy on every mirror, but github.com is reachable — so source it from its
# official git repo. Pinned to the commit whose Cargo.toml declares 0.9.0.
[patch.crates-io]
untrusted = { git = "https://github.com/briansmith/untrusted", rev = "b7c4aea36ca2ddcec71c323fb7b27d5724d73f3a" }

# Read the optimization guideline: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
